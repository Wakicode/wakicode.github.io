<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event</title>
  <!--
    GitHub Pages sirve esta página para cualquier ruta que no existe.
    Los enlaces de los eventos (/event/join/{localizador}) los abre la app Event en Android;
    si no está instalada, esta página muestra el localizador para unirse a mano.
  -->
  <style>
    :root { --bg: #f4faf8; --fg: #1a1c1b; --accent: #006a60; --card: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101413; --fg: #e0e3e1; --accent: #53dbc9; --card: #1a1f1e; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { margin: 16px; padding: 24px; max-width: 420px; background: var(--card); border-radius: 16px; text-align: center; }
    h1 { margin-top: 0; }
    .localizer { font-size: 2rem; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); margin: 16px 0; }
  </style>
</head>
<body>
<main>
  <h1>Event</h1>
  <div id="event" hidden>
    <p>Te han invitado a un evento. Abre este enlace con la app Event o únete desde la app con el localizador:</p>
    <div class="localizer" id="localizer"></div>
    <p>En la app: <strong>Unirme con localizador</strong>.</p>
  </div>
  <p id="notFound">La página que buscas no existe.</p>
</main>
<script>
  // /event/join/{localizador}: se muestra en el formato XXX-XXX-XXX
  var match = location.pathname.match(/\/event\/join\/([A-Za-z0-9-]+)/);
  if (match) {
    var localizer = match[1].replace(/-/g, "").toUpperCase();
    document.getElementById("localizer").textContent = localizer.match(/.{1,3}/g).join("-");
    document.getElementById("event").hidden = false;
    document.getElementById("notFound").hidden = true;
  }
</script>
</body>
</html>
